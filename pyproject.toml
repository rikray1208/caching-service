[project]
name = "payload-cache"
version = "0.1.0"
description = "A FastAPI service that generates payloads from two lists of texts and caches their transformations."
readme = "README.md"
authors = [
    { name = "raule", email = "rostyslav.potapov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1,<2.0.0",
    "anyio>=4.15.1,<5.0.0",
    "asyncpg>=0.32.0,<1.0.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.161.1,<1.0.0",
    "httpx2>=2.16.0,<3.0.0",
    "pydantic>=2.14.1,<3.0.0",
    "pydantic-settings>=2.16.1,<3.0.0",
    "sqlalchemy[asyncio]>=2.1.6,<3.0.0",
]

[project.scripts]
cache-cli = "app.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3.0.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.17.2,<1.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "FAST"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
files = ["src"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
exclude = "^.*alembic.*$"
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pytest]
addopts = ["--color=yes", "-p", "no:cacheprovider"]
testpaths = ["tests"]
anyio_mode = "auto"

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["%(here)s/src"]
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

[[tool.alembic.post_write_hooks]]
name = "ruff-fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff-format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
